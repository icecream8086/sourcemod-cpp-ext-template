name: ci

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [native, "32"]
        avx2: [ON, OFF]
    steps:
      - uses: actions/checkout@v4

      - name: Install multilib
        if: matrix.arch == '32'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

      - name: Configure
        run: |
          cmake -S . -B build -DTEMPLATE_BUILD_EXTENSION=OFF \
            -DTEMPLATE_ARCH=${{ matrix.arch }} \
            -DTEMPLATE_DISABLE_AVX2=${{ matrix.avx2 == 'OFF' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build -j2

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke
        run: ctest --test-dir build -L smoke --output-on-failure

      - name: ISA audit
        run: cmake --build build --target check_isa

      - name: Z3
        run: python3 -m pip install z3-solver

      - name: Formal checks
        run: cmake --build build --target verify

  strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install strict wrapper
        run: |
          sudo install -m 0755 scripts/clang-strict.sh /usr/local/bin/clang++-strict
          clang++-strict --version | head -1

      - name: Configure (L4D2 strict profile)
        run: |
          cmake -S . -B build-strict \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/clang-strict.cmake \
            -DTEMPLATE_BUILD_EXTENSION=OFF

      - name: Build
        run: cmake --build build-strict -j2

      - name: Tests
        run: ctest --test-dir build-strict --output-on-failure

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with sanitisers
        run: |
          cmake -S . -B build -DTEMPLATE_BUILD_EXTENSION=OFF \
            -DTEMPLATE_SANITIZE=address,undefined
      - name: Build
        run: cmake --build build -j2
      - name: Tests
        run: ctest --test-dir build --output-on-failure

  degrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install multilib + qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib qemu-user

      - name: Configure (32-bit guest)
        run: cmake -S . -B build -DTEMPLATE_BUILD_EXTENSION=OFF -DTEMPLATE_ARCH=32

      - name: Build
        run: cmake --build build -j2

      - name: QEMU feature masking matrix
        run: bash scripts/qemu_matrix.sh build
